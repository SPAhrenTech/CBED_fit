# Publishes the web/ folder to eQuillTech.com/CBED_fit over FTP on every push to main.
# Needs repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (Settings > Secrets and variables > Actions).
name: Deploy to eQuillTech.com
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./web/
          server-dir: ./public_html/CBED_fit/
          exclude: |
            **/.DS_Store
